[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methylseqnet_repro"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "methylseqnet[dev] @ file:///clusterfs/nilah/oberon/repos/methylseq-net",
    "ipykernel>=6.29.4",
    "ipywidgets>=8.1.3",
    "seaborn>=0.13.2",
    "adjustText>=1.3.0",
    "openpyxl>=3.1.5",
    "logomaker>=0.8",
    "pyliftover>=0.4.1",
    "statsmodels>=0.14.6",
]

[tool.setuptools]
packages = {find = {}}

[project.scripts]
methylseqnet-repro-path = "methylseqnet_repro.paths:print_path"